<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>AI Job Agent</title>

  <meta name="theme-color" content="#070712" />
  <meta name="description"
        content="Advanced AI Job Agent — task automation command center" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 20% 10%, rgba(92,45,255,.28), transparent 30%),
        radial-gradient(circle at 90% 20%, rgba(0,200,255,.18), transparent 28%),
        radial-gradient(circle at 50% 100%, rgba(255,0,120,.12), transparent 35%),
        #05050d;
      overflow-x: hidden;
    }

    /* ---------- 3D BACKGROUND ---------- */

    .scene {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(2px);
      opacity: .45;
      animation: float 8s ease-in-out infinite;
    }

    .orb.one {
      width: 190px;
      height: 190px;
      top: 8%;
      left: -60px;
      background: radial-gradient(circle at 35% 30%, #b66cff, #3213a8 55%, transparent 72%);
    }

    .orb.two {
      width: 240px;
      height: 240px;
      right: -100px;
      top: 28%;
      background: radial-gradient(circle at 35% 30%, #36e7ff, #0755aa 55%, transparent 72%);
      animation-delay: -3s;
    }

    .orb.three {
      width: 170px;
      height: 170px;
      left: 30%;
      bottom: -80px;
      background: radial-gradient(circle at 35% 30%, #ff3b9d, #8a1263 55%, transparent 72%);
      animation-delay: -5s;
    }

    @keyframes float {
      0%,100% {
        transform: translate3d(0,0,0) scale(1);
      }
      50% {
        transform: translate3d(0,-25px,0) scale(1.06);
      }
    }

    .grid {
      position: absolute;
      width: 140%;
      height: 70%;
      left: -20%;
      bottom: -20%;
      opacity: .12;
      background-image:
        linear-gradient(rgba(255,255,255,.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.18) 1px, transparent 1px);
      background-size: 45px 45px;
      transform: perspective(500px) rotateX(62deg);
      transform-origin: center top;
    }

    /* ---------- APP ---------- */

    .app {
      position: relative;
      z-index: 2;
      width: min(100%, 1100px);
      min-height: 100vh;
      margin: auto;
      padding: 18px;
      padding-bottom: 110px;
    }

    /* ---------- TOP BAR ---------- */

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      font-size: 22px;
      font-weight: 900;
      background:
        linear-gradient(145deg, rgba(255,255,255,.18), rgba(255,255,255,.04));
      border: 1px solid rgba(255,255,255,.18);
      box-shadow:
        inset 0 1px 1px rgba(255,255,255,.2),
        0 12px 35px rgba(76,48,255,.3);
      transform: perspective(500px) rotateX(4deg);
    }

    .brand h1 {
      font-size: 19px;
      letter-spacing: .5px;
    }

    .brand p {
      font-size: 11px;
      color: #9292a8;
      margin-top: 3px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 9px 12px;
      border-radius: 20px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      font-size: 11px;
      color: #bfc2d6;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #35ffb0;
      box-shadow: 0 0 12px #35ffb0;
    }

    /* ---------- HERO ---------- */

    .hero {
      position: relative;
      padding: 26px 20px;
      border-radius: 28px;
      overflow: hidden;
      background:
        linear-gradient(145deg,
          rgba(255,255,255,.105),
          rgba(255,255,255,.035));
      border: 1px solid rgba(255,255,255,.12);
      box-shadow:
        inset 0 1px 1px rgba(255,255,255,.12),
        0 25px 70px rgba(0,0,0,.35);
      backdrop-filter: blur(20px);
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      right: -70px;
      top: -70px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(73,220,255,.22), transparent 70%);
    }

    .hero h2 {
      position: relative;
      font-size: clamp(27px, 7vw, 46px);
      line-height: 1.05;
      margin-bottom: 12px;
    }

    .gradient-text {
      background: linear-gradient(90deg, #fff, #9b8cff, #45ddff);
      -webkit-background-clip: text;
      color: transparent;
    }

    .hero p {
      position: relative;
      color: #a8a8bd;
      font-size: 13px;
      line-height: 1.6;
      max-width: 650px;
    }

    /* ---------- COMMAND BOX ---------- */

    .command-card {
      margin-top: 18px;
      padding: 14px;
      border-radius: 23px;
      background: rgba(5,5,15,.65);
      border: 1px solid rgba(255,255,255,.11);
      box-shadow:
        inset 0 1px 1px rgba(255,255,255,.08),
        0 15px 40px rgba(0,0,0,.25);
    }

    .command-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #commandInput {
      min-width: 0;
      flex: 1;
      height: 54px;
      border: 0;
      outline: none;
      border-radius: 16px;
      padding: 0 15px;
      color: white;
      background: rgba(255,255,255,.065);
      border: 1px solid rgba(255,255,255,.08);
      font-size: 14px;
    }

    #commandInput::placeholder {
      color: #737389;
    }

    .mic,
    .run {
      width: 54px;
      height: 54px;
      flex: 0 0 54px;
      border: 0;
      border-radius: 16px;
      color: white;
      cursor: pointer;
      font-size: 19px;
      background:
        linear-gradient(145deg, rgba(118,80,255,.9), rgba(47,111,255,.65));
      box-shadow:
        inset 0 1px 1px rgba(255,255,255,.2),
        0 10px 25px rgba(70,55,255,.28);
    }

    .run {
      width: auto;
      padding: 0 18px;
      font-size: 13px;
      font-weight: 800;
    }

    .mic:active,
    .run:active {
      transform: scale(.95);
    }

    /* ---------- QUICK TASKS ---------- */

    .section {
      margin-top: 22px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .section-title h3 {
      font-size: 15px;
    }

    .section-title span {
      font-size: 10px;
      color: #77778e;
    }

    .task-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 11px;
    }

    .task {
      min-height: 105px;
      padding: 16px;
      border-radius: 20px;
      cursor: pointer;
      background:
        linear-gradient(145deg,
          rgba(255,255,255,.09),
          rgba(255,255,255,.025));
      border: 1px solid rgba(255,255,255,.09);
      box-shadow:
        inset 0 1px 1px rgba(255,255,255,.08),
        0 12px 30px rgba(0,0,0,.22);
      transition: .2s;
    }

    .task:active {
      transform: translateY(2px) scale(.98);
    }

    .task-icon {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      margin-bottom: 11px;
      background: rgba(255,255,255,.07);
      font-size: 17px;
    }

    .task b {
      font-size: 13px;
    }

    .task small {
      display: block;
      margin-top: 5px;
      color: #7f8097;
      font-size: 10px;
      line-height: 1.4;
    }

    /* ---------- AGENT STATUS ---------- */

    .agent-panel {
      padding: 17px;
      border-radius: 22px;
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.09);
    }

    .agent-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .agent-name {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .agent-avatar {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: linear-gradient(145deg, #693cff, #168bff);
      box-shadow: 0 8px 22px rgba(75,62,255,.3);
    }

    .agent-name b {
      font-size: 13px;
    }

    .agent-name small {
      display: block;
      color: #77788e;
      font-size: 10px;
      margin-top: 3px;
    }

    .agent-state {
      font-size: 10px;
      color: #50ffbd;
    }

    .progress {
      height: 5px;
      margin-top: 17px;
      overflow: hidden;
      border-radius: 10px;
      background: rgba(255,255,255,.07);
    }

    .progress-bar {
      width: 32%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #724cff, #32dfff);
      box-shadow: 0 0 15px rgba(53,190,255,.5);
      transition: width .5s;
    }

    /* ---------- LOG ---------- */

    .log {
      margin-top: 12px;
      min-height: 65px;
      padding: 12px;
      border-radius: 14px;
      background: rgba(0,0,0,.2);
      color: #88899e;
      font-family: monospace;
      font-size: 10px;
      line-height: 1.6;
    }

    /* ---------- BOTTOM NAV ---------- */

    .bottom-nav {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      width: min(calc(100% - 24px), 560px);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 8px;
      border-radius: 22px;
      background: rgba(13,13,25,.82);
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 18px 55px rgba(0,0,0,.55);
      backdrop-filter: blur(22px);
    }

    .nav-btn {
      border: 0;
      background: transparent;
      color: #73748a;
      padding: 10px 4px;
      border-radius: 15px;
      font-size: 10px;
      cursor: pointer;
    }

    .nav-btn span {
      display: block;
      font-size: 18px;
      margin-bottom: 4px;
    }

    .nav-btn.active {
      color: white;
      background: rgba(112,79,255,.17);
    }

    /* ---------- DESKTOP ---------- */
