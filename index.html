<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>JARVIS AI</title>

  <meta
    name="description"
    content="JARVIS AI Command Center"
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 20%, #18265a 0%, transparent 35%),
        radial-gradient(circle at 20% 80%, #351052 0%, transparent 35%),
        #050712;
      color: #fff;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    .app {
      width: 100%;
      max-width: 900px;
      min-height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 70px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,.08);
      background: rgba(5,7,18,.7);
      backdrop-filter: blur(15px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: #8fffe4;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00ffd5;
      box-shadow: 0 0 12px #00ffd5;
    }

    main {
      flex: 1;
      padding: 25px 16px 110px;
    }

    .hero {
      text-align: center;
      padding: 25px 10px 30px;
    }

    .orb {
      width: 150px;
      height: 150px;
      margin: 0 auto 25px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, #fff, #65eaff 8%, #5b4cff 30%, #a100ff 55%, transparent 70%);
      box-shadow:
        0 0 25px #00d9ff,
        0 0 70px rgba(100,50,255,.7),
        0 0 130px rgba(180,0,255,.3);
      animation: pulse 3s infinite ease-in-out;
    }

    @keyframes pulse {
      0%,100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.06);
      }
    }

    h1 {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #9da5c8;
      font-size: 15px;
    }

    .panel {
      border: 1px solid rgba(255,255,255,.09);
      background: rgba(255,255,255,.045);
      backdrop-filter: blur(18px);
      border-radius: 22px;
      padding: 16px;
      min-height: 280px;
      box-shadow: 0 15px 50px rgba(0,0,0,.25);
    }

    .messages {
      min-height: 220px;
      max-height: 430px;
      overflow-y: auto;
      padding: 5px;
    }

    .message {
      padding: 12px 14px;
      margin-bottom: 10px;
      border-radius: 15px;
      line-height: 1.5;
      font-size: 14px;
      white-space: pre-wrap;
    }

    .jarvis {
      background: rgba(0,200,255,.08);
      border: 1px solid rgba(0,220,255,.12);
    }

    .user {
      background: rgba(150,60,255,.12);
      border: 1px solid rgba(170,80,255,.12);
      text-align: right;
    }

    .input-area {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 12px;
      background: rgba(5,7,18,.85);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,.08);
    }

    .input-box {
      max-width: 900px;
      margin: auto;
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 0;
      height: 50px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 15px;
      outline: none;
      padding: 0 15px;
      color: white;
      background: rgba(255,255,255,.07);
      font-size: 15px;
    }

    button {
      height: 50px;
      border: 0;
      border-radius: 15px;
      padding: 0 17px;
      color: white;
      background: linear-gradient(135deg,#315cff,#9b32ff);
      font-weight: 700;
      cursor: pointer;
    }

    button:active {
      transform: scale(.96);
    }

    .mic {
      width: 50px;
      padding: 0;
      font-size: 19px;
    }

    .quick {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-top: 12px;
      padding-bottom: 4px;
    }

    .quick button {
      height: 36px;
      white-space: nowrap;
      font-size: 12px;
      padding: 0 13px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.08);
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 31px;
      }

      .orb {
        width: 125px;
        height: 125px;
      }

      main {
        padding-top: 15px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="brand">🤖 JARVIS</div>

    <div class="status">
      <span class="dot"></span>
      ONLINE
    </div>
  </header>

  <main>

    <section class="hero">
      <div class="orb"></div>

      <h1>JARVIS AI</h1>

      <p class="subtitle">
        Your personal AI Command Center
      </p>
    </section>

    <section class="panel">

      <div id="messages" class="messages">

        <div class="message jarvis">
          Hello! I am JARVIS. 👋
          <br />
          Give me a command to get started.
        </div>

      </div>

      <div class="quick">
        <button onclick="quickCommand('Hello JARVIS')">
          Hello
        </button>

        <button onclick="quickCommand('Help me with coding')">
          Coding
        </button>

        <button onclick="quickCommand('Research AI')">
          Research
        </button>

        <button onclick="quickCommand('Create a report')">
          Report
        </button>
      </div>

    </section>

  </main>

</div>

<div class="input-area">

  <div class="input-box">

    <button
      class="mic"
      id="micButton"
      onclick="startVoice()"
      title="Voice"
    >
      🎙️
    </button>

    <input
      id="commandInput"
      type="text"
      placeholder="Ask JARVIS anything..."
      autocomplete="off"
    />

    <button onclick="sendCommand()">
      SEND
    </button>

  </div>

</div>

<script>
  const input = document.getElementById("commandInput");
  const messages = document.getElementById("messages");

  function addMessage(text, type) {
    const div = document.createElement("div");

    div.className = "message " + type;
    div.textContent = text;

    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function quickCommand(command) {
    input.value = command;
    sendCommand();
  }

  async function sendCommand() {

    const command = input.value.trim();

    if (!command) return;

    addMessage(command, "user");

    input.value = "";

    addMessage("Thinking...", "jarvis");

    try {

      if (typeof window.jarvisSend === "function") {

        const response = await window.jarvisSend(command);

        messages.lastElementChild.remove();

        addMessage(
          typeof response === "string"
            ? response
            : JSON.stringify(response, null, 2),
          "jarvis"
        );

      } else {

        await new Promise(resolve =>
          setTimeout(resolve, 500)
        );

        messages.lastElementChild.remove();

        addMessage(
          "JARVIS received your command. Backend connection is not configured yet.",
          "jarvis"
        );
      }

    } catch (error) {

      messages.lastElementChild.remove();

      addMessage(
        "JARVIS Error: " + error.message,
        "jarvis"
      );
    }
  }

  input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
      sendCommand();
    }

  });

  function startVoice() {

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

      addMessage(
        "Voice recognition is not supported in this browser.",
        "jarvis"
      );

      return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang = "en-IN";
    recognition.interimResults = false;

    recognition.onstart = function() {
      document.getElementById("micButton").textContent = "🔴";
    };

    recognition.onresult = function(event) {

      const text =
        event.results[0][0].transcript;

      input.value = text;

      sendCommand();
    };

    recognition.onerror = function() {

      addMessage(
        "Voice recognition failed. Please try again.",
        "jarvis"
      );

    };

    recognition.onend = function() {
      document.getElementById("micButton").textContent = "🎙️";
    };

    recognition.start();
  }
</script>

<!--
  IMPORTANT:
  app.js can attach the real JARVIS backend
  by defining:

  window.jarvisSend = async function(command) {
      ...
  }
-->

<script src="app.js"></script>

</body>
</html>
